name: Keep Supabase project alive

# Free-tier Supabase projects pause after 7 days with no API activity.
# This pings the REST API every 2 days (safety margin under that window)
# so the shared song library never goes to sleep.
on:
  schedule:
    - cron: "0 12 */2 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          # This is Supabase's "publishable" anon key, not a secret — it's already
          # embedded in plain text in the app's deployed JS bundle. RLS policies,
          # not key secrecy, are what protect the data.
          SUPABASE_ANON_KEY: sb_publishable_s5lLGmfNSqB_GeMNrJC9sw_-zRQCjJ_
        run: |
          curl -sf "https://gjawldccyyibyvkbmnlg.supabase.co/rest/v1/song_storage?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
